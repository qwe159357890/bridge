name: Build Internal Test APK

# 内部测试打包：打 tag v* 触发，产出 debug 签名的 APK（无需任何密钥配置）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 JDK 17（本项目 compileOptions/Kotlin 均为 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Gradle（缓存依赖，加速构建）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 构建 debug APK（使用 Android 自带 debug keystore，无需任何密钥）
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. 上传 APK 作为 workflow artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 6. 打 tag v* 时创建 GitHub Release 并附上 APK，供内部同事直接下载安装
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
