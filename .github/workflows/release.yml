name: Build Release APK

# 触发条件：
#   1. 推送 v* 标签（发布正式版）
#   2. 手动触发（workflow_dispatch）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 JDK 17（本项目 compileOptions/Kotlin 均为 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Gradle（缓存依赖，加速构建）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 从 Secrets 解码出签名 keystore
      #    需在仓库 Settings → Secrets and variables → Actions 配置：
      #      KEYSTORE_BASE64  : base64 编码的 keystore 文件内容
      #      KEYSTORE_PASSWORD: keystore 密码
      #      KEY_ALIAS        : key 别名
      #      KEY_PASSWORD     : key 密码
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # 5. 构建 release APK（签名由 app/build.gradle.kts 从环境变量读取）
      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 6. 上传 APK 作为 workflow artifact（无论成功失败都尽量保留）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # 7. 若由 v* 标签触发，则创建 GitHub Release 并上传 APK
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
