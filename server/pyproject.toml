[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridge-server"
version = "0.1.0"
description = "Bridge 的 Python 服务端（FastAPI + WebSocket），承载 Android 客户端的 WebSocket 长连接，负责连接管理。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "PyMySQL>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "websockets>=12.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
