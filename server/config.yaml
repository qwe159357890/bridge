# Bridge Server 配置
#
# 加载优先级（低 -> 高）：
#   内置默认值 < 本文件 < BRIDGE_CONFIG 指定的文件 < BRIDGE_* 环境变量
# 环境变量示例：BRIDGE_HEARTBEAT_INTERVAL=30 覆盖 heartbeat.interval。

server:
  host: "0.0.0.0"
  port: 15160
  max_message_size: 65536        # 单条消息最大字节数

heartbeat:
  interval: 20                   # 客户端心跳发送周期（秒）
  client_pong_timeout: 10        # 客户端 ping 后等 pong 超时（秒）
  server_read_timeout: 45        # 服务端读超时（秒），须 > interval（建议 > 2 倍）

reconnect:
  base_delay: 1                  # 重连基础退避（秒）
  max_delay: 60                  # 重连最大退避（秒）
  jitter: 0.2                    # 随机抖动比例（±20%）

connection:
  unique_per_device: true        # 同一 device_id 全局只保留一条活跃连接
  max_connections: 10000         # 全局最大并发连接数（0 = 不限）

auth:
  enabled: true                  # 是否启用设备鉴权（true = 必须注册拿 token 才能连接）
  token_ttl: 0                   # token 有效期（秒），0 = 永久

admin:
  username: "admin"              # 管理后台登录账号
  password: "admin123"           # 管理后台登录密码（生产环境务必用环境变量覆盖）
  token_ttl: 86400               # 管理员 token 有效期（秒），默认 24 小时

logging:
  level: "INFO"                  # DEBUG / INFO / WARNING / ERROR / CRITICAL

adb:
  # adb 可执行文件路径：默认从 PATH 找（可能撞上 C:\Windows 里的 1.0.32 古董版，
  # 不支持 adb pair）。项目自带最新版 platform-tools（tools/adb/platform-tools），
  # 此处显式指向它；换机部署时按实际路径调整
  path: "../tools/adb/platform-tools/adb.exe"

music:
  dir: "data/music"              # 音乐共享目录（play_music 裸文件名音源）
                                 # 相对路径相对 server 根目录，管理员把音乐文件放入即可下发

connection_events:
  retention_days: 90             # 设备上下线记录保留天数（MySQL 表，超龄自动清理；0=永不清理）

logs:
  retention_days: 30             # 设备诊断日志保留天数（MySQL 表，超龄自动清理；0=永不清理）
  max_entries_per_device: 2000   # 单设备最多保留条数（兜底，防极端刷爆；0=不限；主策略是上面的按天清理）
  page_size: 20                  # 管理后台日志查看每页条数（1~200）

locations:
  mysql:
    host: "127.0.0.1"            # MySQL 主机（get_location 上报持久化）
    port: 3306
    user: "root"
    password: ""                 # 敏感！真实密码放 config.local.yaml（不入库），库不存在自动创建
    database: "bridge"
  amap:
    key: ""                      # 高德 Web端(JS API) Key，敏感！真实值放 config.local.yaml
    security_js_code: ""         # 2021-12 后申请的 Key 需配安全密钥，同样放 config.local.yaml
    web_key: ""                  # 高德 Web服务 Key（服务端逆地理编码）；2021-12 前老 Key 可与 key 相同
