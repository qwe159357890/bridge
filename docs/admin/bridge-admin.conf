# =============================================================================
# Bridge 管理后台（admin）nginx 站点配置
#
# 参考：wxhelper.conf 的 SSL / 端口 / SPA fallback 结构
# 差异：按 appClient 实际后端路由补齐（详见 docs/admin/client-embed-admin.md §1.2/§6）
# 部署：放 /etc/nginx/conf.d/bridge-admin.conf（该文件整体被 http{} include）
# dist：/home/qwe159357/software/appClient/admin/dist/
#
# ★ 落地前必须确认的 3 个变量：
#   1) upstream bridge_backend → 后端真实 IP:端口（server/config.yaml: port 15160）
#   2) server_name / listen     → 若 wxhelper.conf 已在用同一组，必须换，否则 conflicting server name
#   3) ssl_certificate / key    → 2026-11-10 实测为 Let's Encrypt 签发的 *.039039.xyz
#                                受信任证书（有效至 2027-01-20），WebView / OkHttp 均可直连。
#
# ★ 环境对照（权威表 docs/admin/environment-matrix.md）：
#   生产三处默认值：二维码 public_base_url / admin URL / 设备端服务地址
#                  均为 https://appclient.039039.xyz:15443
#   测试（本机 npm run dev）：二维码与设备端服务地址 http://039039.xyz:15160，
#                  admin URL http://192.168.31.226:5173
#
# ★ 下方 15080 的 server 级 301 实测对所有路径生效（/api/、/ws、/d、POST 均跳），
#   浏览器访问 http 会自动跳 https；设备端 v0.2.130 起直连 15443（wss），
#   不再经过 15080，故保留该跳转不影响设备端。
#
# ★ 与「复用 wxhelper.conf」二选一：若直接改原文件，只把下面缺失的 location 补进去即可。
# =============================================================================

# --- http{} 上下文 -----------------------------------------------------------
# 本文件放在 conf.d/ 下时整体处于 http{} 内，故 map / upstream 可放这里。
# 若你的 nginx 把 *.conf include 在 server{} 内，请把这两段移到 nginx.conf 的 http{}。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bridge_backend {
    # 同机部署（推荐）：nginx 与 `uv run main` 在同一台机器
    server 127.0.0.1:15160;
    # 后端在另一台机器时改成（参考 wxhelper.conf 的地址，注意端口是 15160 不是 15151）：
    # server 86.74.128.24:15160;
}

server {
    listen 15080;
    listen 15443 ssl http2;          # nginx >= 1.25.1 建议 listen 15443 ssl; + http2 on;
    server_name appclient.039039.xyz;

    if ($scheme = http) {
        return 301 https://$host:15443$request_uri;
    }

    ssl_certificate     /etc/nginx/conf.d/ssl_conf/cert.pem;
    ssl_certificate_key /etc/nginx/conf.d/ssl_conf/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 200m;       # 媒体上传 / APK，默认 1m 会 413

    root  /home/qwe159357/software/appClient/admin/dist/;
    index index.html;

    # ---------- 反代通用头（server 级，所有含 proxy_pass 的 location 继承）----------
    # 注意：某个 location 一旦自己写了 proxy_set_header，继承即中断，需自行写全。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 二维码对外地址推导用（updates.py::_public_base_url）：$http_host 含端口 15443，
    # $host 不含，写错会让二维码丢端口、扫码走 443 不通。
    proxy_set_header X-Forwarded-Host  $http_host;
    # WebSocket 升级：管理侧 WS 在 /api/ 下，故必须全局生效，不能只给 /ws
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 60;
    proxy_send_timeout    300;
    proxy_read_timeout    86400;      # WS 长连接，避免默认 60s 被断

    # ---------- 前端静态（nginx 直接服务）----------
    # index.html 禁缓存：否则发新版后仍引用旧 hash 的 assets → 白屏
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    # vite 产物带内容 hash，可长缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    location = /qrcode.js {
        expires 7d;
    }
    # SPA history 模式（createWebHistory）兜底，深层路由刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端反代（admin 的 VITE_API_BASE 为空 = 同源相对路径）----------
    # proxy_pass 不带 URI：原样保留请求路径，后端路由前缀正好是 /api
    # REST：/api/* ；管理侧 WS：/api/admin/ws、/api/admin/stream/{device_id}
    location ^~ /api/ {
        proxy_pass http://bridge_backend;
    }

    # 设备端 WebSocket：app/api/ws.py 的 /ws（无 /api 前缀）
    location ^~ /ws {
        proxy_pass http://bridge_backend;
    }

    # 首页 dashboard 健康检查
    location = /health {
        proxy_pass http://bridge_backend;
    }

    # 扫码下载落地页（GET /download，返回 HTML + 二维码）
    location = /download {
        proxy_pass http://bridge_backend;
    }

    # APK 免鉴权短链（GET /d，updates.py:214；精确匹配，不误伤 /download）
    location = /d {
        proxy_pass http://bridge_backend;
        proxy_buffering off;          # 46MB 流式下发，不先落盘再转
    }

    # 服务端静态资源（落地页引用的 /static/qrcode.js 等）
    location ^~ /static/ {
        proxy_pass http://bridge_backend;
    }
}

# =============================================================================
# 验证清单（部署后逐条 curl / 浏览器确认）
#   1. nginx -t && nginx -s reload
#   2. curl -I  https://appclient.039039.xyz:15443/            → 200，index.html
#   3. curl -I  https://appclient.039039.xyz:15443/assets/<某个hash>.js → 200 + Cache-Control: immutable
#   4. curl     https://appclient.039039.xyz:15443/health       → 后端 JSON（非 SPA 的 index.html）
#   5. curl     https://appclient.039039.xyz:15443/api/download/info → 返回 apk_url 含 :15443 与 /d
#   6. 浏览器登录 → 命令下发页看实时回执是否推送（验证 /api/admin/ws 的 Upgrade）
#   7. 浏览器直接访问一个深层路由并刷新 → 不 404（验证 try_files）
#   8. curl -I  https://appclient.039039.xyz:15443/d            → 200 application/vnd.android.package-archive
#
# 若第 5 步返回的 apk_url 是 http://039039.xyz:15160/d：
#   把 server/config.yaml 的 updates.public_base_url 留空（走 X-Forwarded-* 推导），
#   或写死 https://appclient.039039.xyz:15443，然后重启后端。
# =============================================================================
