# =============================================================================
# Bridge Server · supervisord 进程配置模板
#
# 参照：桌面 autoxServer.conf（autoxClient 项目的 [program:autoxServer]）
# 差异：按 appClient 实际启动方式、目录、进程树与日志策略加固，详见下方「相对参考改了什么」。
# 权威配置取值：docs/admin/environment-matrix.md（三处地址）、server/config.yaml（端口 15160）
#
# 部署：复制为 /etc/supervisor/conf.d/bridge.conf（Ubuntu 主配置默认 include conf.d/*.conf）
# 前置（4 个必须现场确认的变量）：
#   1) uv 绝对路径 /home/qwe159357/.local/bin/uv —— 同机同用户的 autoxServer.conf 里就是这个
#   2) 项目根 /home/qwe159357/software/appClient/ —— 由 admin/dist 的上传路径推得
#   3) 已在 server/ 下跑过 uv sync（.venv 就绪），避免开机启动时联网解析依赖卡住
#   4) 先停掉任何手工 / nohup / systemd 拉起的旧后端，否则 15160 端口冲突
#      server/logs/ 目录需存在且 user=qwe159357 可写
#
# 启用：sudo supervisorctl reread && sudo supervisorctl update
#        sudo supervisorctl status appclient:*
# 日常：sudo supervisorctl restart appclient:appclient-server
#        sudo supervisorctl tail -f appclient:appclient-server stderr
# 回滚：删除该 conf → reread + update → 恢复原来的手工 `cd server && uv run main.py`
#
# ★ 相对参考配置改了什么（每一条都对应本项目实际踩点）：
#   1) command 去掉 sudo：supervisord 通常以 root 运行，user= 已经降到 qwe159357；
#      sudo 在无 tty 环境会要密码失败，而且多 fork 一层进程，stop 时杀不干净。
#   2) 删掉 username=qwe159357：这不是 [program:x] 的合法字段（那是
#      [supervisorctl] / [unix_http_server] 段的），放在这里不生效。
#   3) directory 必须是 server 根：server/config.yaml 里 updates.dir=data/updates、
#      music.dir=data/music、adb.path=../tools/... 都是相对工作目录解析的，指错会
#      读不到 APK / 音乐 / adb；server/main.py 是唯一启动入口（不要直接 uvicorn）。
#   4) startsecs 55 → 5：本项目是 FastAPI + uvicorn，秒级启动；55 秒会让启动失败
#      也干等 55 秒才判定，状态迟迟不进 RUNNING。首次 uv sync 较慢可临时调到 15。
#   5) 新增 stopasgroup / killasgroup：uv run 会派生 python 子进程，不按进程组杀
#      会出现「supervisorctl stop 显示已停，15160 仍被占用」的假停止。
#   6) 新增 stopwaitsecs / startretries / 日志切割：APK 流式下载（约 46MB）、TTS
#      请求需要收尾时间；uvicorn access log 量很大，日志不切割会撑爆磁盘。
#   7) 新增 PYTHONUNBUFFERED=1：让 uv / print 输出实时进日志，排障不用等缓冲刷新。
#
# ★ 日志分两套，别混：
#   - server/logs/server.log        = 项目自己用 TimedRotatingFileHandler 写的业务日志
#                                     （按天轮转、保留 7 份），排障优先读它
#   - server/logs/supervisor-*.log  = supervisord 捕获的进程 stdout / stderr
#                                     （uvicorn access log、启动输出、崩溃堆栈）
#   两者互不覆盖，文件名也不冲突。
#
# ★ 敏感项：server/config.yaml 里的 admin.password / ui_lock.pin 只是占位，真实值走
#   server/config.local.yaml（项目已支持、gitignore）。若要用环境变量覆盖，可在
#   environment= 里追加 BRIDGE_ADMIN_PASSWORD="..."，但 conf 会落明文，务必 chmod 600。
#
# ★ 不归 supervisor 管：nginx（15443 托管 admin/dist + 反代）、MySQL 都是 systemd
#   系统服务，不要塞进来。测试用的 Vite 5173 见文件末尾「可选段」，默认注释。
#
# ⚠️ supervisor 的 ini 不支持行内注释，所以所有注释都单独占一行，别写成 `key=value  # 说明`。
# =============================================================================

# -----------------------------------------------------------------------------
# 主进程 · Python 后端（FastAPI + WebSocket / REST，监听 15160）
# -----------------------------------------------------------------------------
[program:appclient-server]
directory=/home/qwe159357/software/appClient/server
command=/home/qwe159357/.local/bin/uv run main.py
user=qwe159357
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=10
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/home/qwe159357/software/appClient/server/logs/supervisor-out.log
stderr_logfile=/home/qwe159357/software/appClient/server/logs/supervisor-err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
redirect_stderr=false

# -----------------------------------------------------------------------------
# 可选 · TTS 分段预热（一次性任务，不是常驻服务）
# -----------------------------------------------------------------------------
# 作用：把 0..100 数字 + 播报词组预合成到 server/data/tts_cache/，客户端首次播报
#       即可本地拼接、零网络等待。幂等，已存在的段自动跳过（server/tts_prewarm.py）。
# 什么时候跑：首次部署 / 换语音音色 / 清空 tts_cache 之后，手动跑一次即可。
# 用法：sudo supervisorctl start appclient:appclient-tts-prewarm
# 注意：autostart=false + autorestart=false + startsecs=0，跑完显示 EXITED 是正常的；
#       千万别配 autorestart=true，否则会反复重跑同一批合成任务。
[program:appclient-tts-prewarm]
directory=/home/qwe159357/software/appClient/server
command=/home/qwe159357/.local/bin/uv run python tts_prewarm.py
user=qwe159357
autostart=false
autorestart=false
startsecs=0
priority=20
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/home/qwe159357/software/appClient/server/logs/supervisor-tts-prewarm-out.log
stderr_logfile=/home/qwe159357/software/appClient/server/logs/supervisor-tts-prewarm-err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
redirect_stderr=false

# -----------------------------------------------------------------------------
# 进程组 · 便于 `supervisorctl status appclient:*` 一次看全
# -----------------------------------------------------------------------------
# ⚠️ 日常重启请用精确名 `restart appclient:appclient-server`；
#    别用 `restart appclient:*`，那会把上面那个一次性预热任务也拉起来。
[group:appclient]
programs=appclient-server,appclient-tts-prewarm
priority=999

# -----------------------------------------------------------------------------
# 可选段 · 仅测试机（npm run dev，5173），生产服务器不要启用
# -----------------------------------------------------------------------------
# 生产的管理页由 nginx 直接托管 admin/dist/，没有常驻前端进程；只有测试时才需要
# 把 Vite dev server 交给 supervisor。启用时把下面各行开头的 # 去掉，并按本机
# admin/vite.config.ts 与 npm 实际路径调整；Vite 只代理 /api、/health、/download、
# /static，设备端 /ws 仍直连后端 15160（见 docs/admin/environment-matrix.md §一）。
#
# [program:appclient-admin-dev]
# directory=/home/qwe159357/software/appClient/admin
# command=/usr/bin/npm run dev -- --host 0.0.0.0
# user=qwe159357
# autostart=false
# autorestart=true
# startsecs=5
# priority=30
# stopasgroup=true
# killasgroup=true
# environment=NODE_ENV="development"
# stdout_logfile=/home/qwe159357/software/appClient/server/logs/supervisor-admin-dev-out.log
# stderr_logfile=/home/qwe159357/software/appClient/server/logs/supervisor-admin-dev-err.log
# stdout_logfile_maxbytes=20MB
# stdout_logfile_backups=3
# stderr_logfile_maxbytes=20MB
# stderr_logfile_backups=3
